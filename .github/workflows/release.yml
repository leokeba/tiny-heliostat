# Each push to main: the host tests, then a release of the firmware under the
# next patch version (tiny-heliostat-esp32.bin, the image the heliostat
# installs from /sys/firmware/github, and tiny-heliostat-esp32-factory.bin, the
# whole flash for a new board), built by TesserKIT's firmware.yml against the
# libraries' main branches. A commit message with "[skip ci]" releases
# nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, so two pushes never take the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      # The repository and the libraries side by side, as on a developer's
      # machine.
      - uses: actions/checkout@v5
        with:
          path: tiny-heliostat
      - name: Check out the libraries
        run: |
          for repo in TesserAPI TesserUI TesserKIT TesserMotion; do
            git clone -q --depth 1 "https://github.com/leokeba/$repo" "$repo"
            echo "$repo $(git -C "$repo" rev-parse --short HEAD)"
          done
      - name: Build and run tests (ASan + UBSan)
        working-directory: tiny-heliostat
        run: |
          cmake -S . -B build
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  firmware:
    needs: host-tests
    permissions:
      contents: write
    uses: leokeba/TesserKIT/.github/workflows/firmware.yml@main
    with:
      project: firmware
      name: tiny-heliostat
      dependencies: |
        leokeba/TesserAPI
        leokeba/TesserUI
        leokeba/TesserKIT
        leokeba/TesserMotion
        leokeba/NowTP
